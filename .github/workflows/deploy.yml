# Every push to main: test, build, put the result on the VPS, restart the server, and check that it answers.
# One-time setup is in deploy/README.md. The secrets this reads (Settings > Secrets and variables > Actions):
#   VPS_HOST         the VPS's address (an IP or a name)
#   VPS_USER         deploy
#   VPS_SSH_KEY      the PRIVATE half of the deploy key (the public half is on the VPS)
#   VPS_KNOWN_HOSTS  the VPS's host key: output of  ssh-keyscan -t ed25519 <host>  (so GitHub talks to YOUR machine only)
#   VPS_PORT         optional, if SSH is not on 22
#   PUBLIC_URL       https://your.domain  (for the check at the end)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # a server that fails its own checks is never put on the VPS
      - name: Test
        run: npm test

      - name: Build the website
        run: npm run build

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      # the code, the built website and the production dependencies. data/ and payload/ are the VPS's own and are never
      # touched (they are excluded, so --delete does not remove them either).
      - name: Upload
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          rsync -rltz --omit-dir-times --no-perms --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes" \
            --exclude '/.git' --exclude '/.github' --exclude '/node_modules' --exclude '/data' --exclude '/payload' \
            --exclude '/.next/cache' --exclude '/test' \
            ./ "$USER_@$HOST:/opt/grape-server/"

      - name: Install and restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes "$USER_@$HOST" \
            'cd /opt/grape-server && npm ci --omit=dev --no-audit --no-fund && sudo -n /usr/bin/systemctl restart grape-server'

      - name: Check that it answers
        env:
          URL: ${{ secrets.PUBLIC_URL }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$URL/v1/health" | grep -q '"ok":true'; then echo "up"; exit 0; fi
            sleep 3
          done
          echo "The server did not answer after the deploy: look at  journalctl -u grape-server -n 50  on the VPS" >&2
          exit 1
